<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif}
        body{background:#f8fafc;padding:15px;max-width:800px;margin:0 auto}
        .title{text-align:center;color:#165DFF;margin:20px 0}

        #searchInput{flex:1;padding:10px;border:1px solid #ddd;border-radius:8px}
        .searchBtn{padding:10px 15px;background:#165DFF;color:white;border:none;border-radius:8px;cursor:pointer}
        .clearBtn{background:#94a3b8}
        .progress{text-align:center;margin-bottom:15px}

        .opt.correct{background:#dcfce7;border-color:#16a34a}
        .opt.wrong{background:#fee2e2;border-color:#ef4444}
        .opt.disabled{pointer-events:none;opacity:0.7}
        .nav{display:flex;gap:15px;margin-top:20px}
        .nav button{flex:1;padding:12px;background:#165DFF;color:white;border:none;border-radius:8px;cursor:pointer}
        .nav button:disabled{background:#94a3b8;cursor:not-allowed}
        .type{display:inline-block;padding:3px 6px;background:#dbeafe;color:#1e40af;font-size:12px;border-radius:4px;margin-left:8px}
        .function-bar{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap;justify-content:center}
        .func-btn{padding:8px 15px;background:#3b82f6;color:white;border:none;border-radius:6px;cursor:pointer}
        .func-btn.active{background:#165DFF;box-shadow:0 0 0 2px #fff,0 0 0 4px #165DFF}
        .func-btn.error-btn{background:#ef4444}
        .func-btn.reset-btn{background:#f59e0b}
        .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;justify-content:center;align-items:center;z-index:999}
        .modal-content{background:white;padding:20px;border-radius:12px;width:90%;max-width:700px;max-height:80vh;overflow-y:auto}
        .close-modal{float:right;background:#ef4444;color:white;border:none;padding:5px 10px;border-radius:4px;cursor:pointer;margin-bottom:10px}
        .error-item{padding:15px;border-bottom:1px solid #eee;margin-bottom:10px}
        .error-item-title{font-weight:bold;margin-bottom:8px}
        .error-item-options{margin-left:15px}
        .error-item-answer{color:#16a34a;margin-top:8px}
        .show-answer{color:#165DFF;cursor:pointer;margin-left:10px;font-size:14px}
        .progress-info{text-align:center;margin:10px 0;color:#666}
        .mark-wrong{position:absolute;top:5px;right:5px;color:#ef4444;font-size:12px;background:#fee2e2;padding:2px 5px;border-radius:3px}
        .feedback{text-align:center;margin-top:15px;padding:10px;border-radius:6px;display:none}
        .feedback.show{display:block}
        .feedback.correct{background:#dcfce7;color:#166534}
        .feedback.wrong{background:#fee2e2;color:#991b1b}
    </style>
</head>
<body>

<h2 class="title">A350 SOP专项复习（整合版·200题）</h2>

<div class="progress-info">
    已完成: <span id="completedCount">0</span> / <span id="totalCount">200</span> 题 | 错题数: <span id="errorCount">0</span>
</div>

<div class="search">
    <input id="searchInput" placeholder="搜索题目关键词">
    <button class="searchBtn" onclick="doSearch()">搜索</button>
    <button class="searchBtn clearBtn" onclick="clearSearch()">清空</button>
</div>

<div class="function-bar">
    <button class="func-btn active" data-mode="order" onclick="setMode('order')">顺序练习</button>
    <button class="func-btn" data-mode="random" onclick="setMode('random')">随机练习</button>
    <button class="func-btn" data-mode="error" onclick="setMode('error')">错题练习</button>
    <button class="func-btn error-btn" onclick="openErrorBook()">查看错题本</button>
    <button class="func-btn reset-btn" onclick="resetProgress()">重置所有进度</button>
</div>

<div class="progress">
    第 <span id="current">1</span> 题 / 共 <span id="total">200</span> 题
    <span id="type" class="type">单选题</span>
</div>

<div class="card">
    <div class="qTitle" id="qTitle"></div>
    <div class="options" id="opts"></div>
    <div class="feedback" id="feedback"></div>
</div>

<div class="nav">
    <button id="prev" disabled>上一题</button>
    <button id="next">下一题</button>
</div>

<div class="modal" id="errorModal">
    <div class="modal-content">
        <button class="close-modal" onclick="closeErrorBook()">关闭</button>
        <h3 style="margin-bottom:15px;text-align:center">错题本</h3>
        <div id="errorList"></div>
        <div id="emptyErrorTip" style="text-align:center;color:#666;display:none;padding:20px">
            暂无错题，继续加油！
        </div>
    </div>
</div>

<script>
// ===================== 更新后的原始题库（100题，来自20260807新文件）=====================
const originalQuestions = [
    {"title":"当机组选择的高度高于当前高度，机组选择了下降率后，FMA第二栏会显示蓝色的 ALT 预位模式。该描述？","options":["正确","错误"],"answer":"B"},
    {"title":"所有FMA的变化都由PM喊出，PF检查后喊\"检查\"。","options":["正确","错误"],"answer":"B"},
    {"title":"RVSM空域内，如需要，机组可实施\"AP关，FD关，AT关\"的人工飞行？","options":["正确","错误"],"answer":"B"},
    {"title":"飞行关键阶段包括滑行、起飞、着陆和除巡航外机场标高以上10000英尺以下的飞行阶段。","options":["正确","错误"],"answer":"A"},
    {"title":"为确保正确的情景意识，飞行机组对FMA必须始终做到：监控FMA、宣布FMA、证实FMA、理解FMA。","options":["正确","错误"],"answer":"A"},
    {"title":"是否实施人工飞行可以由PF单方面决定，无需与另一名飞行员达成一致。","options":["正确","错误"],"answer":"B"},
    {"title":"FMA上所有生效的模式在喊话时都必须报出相关颜色，如\"NAV绿色\"。","options":["正确","错误"],"answer":"B"},
    {"title":"PF报出FMA变化后，PM应检查PF报出的所有FMA变化并喊出\"检查\"。","options":["正确","错误"],"answer":"A"},
    {"title":"在非正常情况和紧急情况下，当飞机停稳以后的任意时刻，若驾驶舱同时收EMER CALL、紧急密码进入铃声以及拍打驾驶舱门的信号时，代表客舱出现了明显危及机上人员生命安全的情况，如果此时飞行机组还不能给出进一步的明确指令，客舱机组可以自主组织实施应急撤离。","options":["正确","错误"],"answer":"A"},
    {"title":"在起飞和着陆前，机组应当提前研判低空雨量情况，提前明确雨刷操作的具体分工和挡位，以避免在低空关键阶段PF受到雨刷操作的相关干扰","options":["正确","错误"],"answer":"A"},
    {"title":"正确使用气象雷达来避免进入积雨云和附近的颠簸区，理想的水平避让距离是上风方向 20 海里。","options":["正确","错误"],"answer":"A"},
    {"title":"如果在飞行中出现了中度颠簸，飞行机组必须在记录本上记录以便开始执行维护措施。","options":["正确","错误"],"answer":"B"},
    {"title":"在始发机场，机组必须按提供的规定路线进行飞机外部安全检查，过站机场可按需选择执行。以上说法是否正确？","options":["正确","错误"],"answer":"B"},
    {"title":"获得起飞许可后，PF设置推力手柄到起始稳定值后报出“起飞”（TAKEOFF）","options":["正确","错误"],"answer":"B"},
    {"title":"执行旅客在机上加油程序前，机组应通知AOC或机场现场指挥,并确认客舱已做好旅客在机场加油准备工作。","options":["正确","错误"],"answer":"A"},
    {"title":"当ATC修改了离场指令时，就应当执行离场变化检查单。离场变化检查单与滑行检查单无先后之分，并且如果在起飞前多次发生变化，离场检查单可能需要多次执行。","options":["正确","错误"],"answer":"A"},
    {"title":"在巡航中，由飞行机组自行决定任务分工，定期查看系统显示页，尤其是发动机、引气、电气、液压、燃油、空调、飞行控制、舱门。","options":["正确","错误"],"answer":"A"},
    {"title":"当飞机进跑道时，设定接通STEOBE（频闪灯）电门，PF可以发口令要求PM去设置外部灯。","options":["正确","错误"],"answer":"A"},
    {"title":"着陆后动作流程中并不包含EFIS面板重置，飞行机组应在驾驶舱准备阶段进行EFIS面板设置。着陆后动作中执行EFIS面板重置不会带来安全收益，反而会增加着陆后动作流程的复杂性，带来不必要的工作负荷并且可能分散 PM 注意力，降低安全裕度。","options":["正确","错误"],"answer":"A"},
    {"title":"在外部绕机检查过程中停留刹车必须设置到 ON，以使飞行机组能够检查刹车磨损指示器；外部绕机检查确保飞机整体状态符合要求，可视飞机部件和设备对于飞行是安全的。","options":["正确","错误"],"answer":"A"},
    {"title":"进入RVSM区域程序，在进入RVSM空域之前，RVSM所需设备---工作/BOTH，如果在飞机进入RVSM空域之前任何要求的设备失效，则飞行机组必须请求新的许可，以避开RVSM空域，高度---检查/BOTH，在PFD上检查高度指示（在标准气压设置）之间的差异小于SOPG 02-15-05表中规定容差。","options":["正确","错误"],"answer":"A"},
    {"title":"自动喊话可替代人工喊话；如自动喊话失效，PM应人工喊话。","options":["正确","错误"],"answer":"A"},
    {"title":"如果气象条件有可能产生变化，或降水活动频繁/严重，飞行机组应考虑额外的空中着陆性能评估作为备份，这个评估应考虑可能出现的最差的刹车性能等级，用代码“1-中到差”执行一个二次评估是安全的做法","options":["正确","错误"],"answer":"B"},
    {"title":"检查单动作被称为“问/答”式的动作。PM 读出每行所有的内容，并且只有当 PF 和 PM 检查了飞机当前状态之后再对“询问”进行“答复”。","options":["正确","错误"],"answer":"B"},
    {"title":"长航线运行，非关键阶段，负责无线电联络的PM可以用驾驶舱扬声器代替耳机守听。","options":["正确","错误"],"answer":"B"},
    {"title":"检查单的部分项目答复中标注了“左右座”，要求 PF 和 PM 分别检查飞机当前状态之后再对“询问”进行“答复”。","options":["正确","错误"],"answer":"A"},
    {"title":"飞行过程中应加强对FMA的有效监控，任何FMA的变化都应该谁发现谁喊出，确保飞机模式的变化第一次时间被机组知晓,而不用拘谨于任务分工。","options":["正确","错误"],"answer":"B"},
    {"title":"飞行中飞行中良好的飞行节奏和明确的任务分工是至关重要的，当FMA飞行模式发生变化时，相关的模式会有白色方框(10秒)提示机组模式变化，在此期间，PF报出FMA,PM检查。","options":["正确","错误"],"answer":"A"},
    {"title":"为尽快遮挡阳光，两名飞行员可以同时操作遮光板上的遮光膜。","options":["正确","错误"],"answer":"B"},
    {"title":"《飞行记录本》是确保机组知晓飞机状态的必要文件，在飞行中遇到的飞机状态的任何异常都应该被有效的记录，既确保了航后与机务的标准沟通，也是对后续运行该飞机的机组负责。","options":["正确","错误"],"answer":"A"},
    {"title":"FMA模式喊话的规则是？","options":["待命模式报颜色，生效模式无需报颜色","生效模式报颜色，待命模式不报颜色","两者都需要报颜色","两者都不需要报颜色"],"answer":"A"},
    {"title":"情况与预期不一致且无充分时间分析解决时，PF改变自动化程度的正确做法是？","options":["从管理引导变为选择引导，或从选择引导变为人工飞行","立即断开全部自动设备改为人工飞行","从选择引导变为管理引导","保持现有模式等待PM分析"],"answer":"A"},
    {"title":"PF发出放襟翼指令，PM的正确动作及应答顺序是？","options":["直接喊\"襟翼X\"，同时执行动作","先\"速度检查\"，执行动作并确认后喊\"襟翼X\"","先喊\"襟翼X\"，再检查速度，再做动作","只需要做动作不需要喊话"],"answer":"B"},
    {"title":"PF发出起落架收放指令时，PM检查什么后回答？","options":["检查速度","检查起落架指示器上的红灯后","检查高度","检查构型"],"answer":"B"},
    {"title":"PF/PM转换时，交出操作的正确喊话顺序是？","options":["\"你操作\" → \"我操作\"","\"交给你\" → \"我操作\"","\"我接管\" → \"明白\"","\"你来\" → \"我来\""],"answer":"A"},
    {"title":"断开自动驾驶的标准喊话是？","options":["PF报\"我操作\"，PM报\"我监控\"","PF报\"断开自驾\"，PM报\"检查\"","直接断开即可","PM报\"我操作\"，PF报\"我监控\""],"answer":"A"},
    {"title":"进近阶段，无线电高度表工作是否有标准喊话？","options":["该阶段不涉及标准喊话","有标准喊话，PM喊出：无线电高度表工作，PF喊出：检查。","有标准喊话，PF喊出：无线电高度表工作，PM喊出：检查。","有标准喊话，但没有特别的要求，谁发现谁喊出即可"],"answer":"B"},
    {"title":"进近中1000英尺RA时的标准喊话是？","options":["PF喊\"1000\"，PM喊\"检查\"","PM喊\"1000\"，PF喊\"检查\"","PF喊\"1000\"，PM喊\"1000 检查\"","PM喊\"1000\"，PF喊\"1000检查\""],"answer":"B"},
    {"title":"若无自动喊话，到达决断高/最低下降高时的标准喊话是？","options":["PM喊\"决断\"/\"最低高度\" PF喊\"继续\"","PF喊\"决断\"/\"最低高度\" PM喊\"继续\"","机长喊\"决断\"/\"最低高度\" 副驾驶喊\"检查\"","副驾驶喊\"决断\"/\"最低高度\" 机长喊\"检查\""],"answer":"A"},
    {"title":"接地后，PM检查扰流板未放出时应喊什么？","options":["\"没有扰流板\"","\"扰流板未放出\"","\"扰流板故障\"","\"检查扰流板\""],"answer":"A"},
    {"title":"自动刹车断开时的标准喊话是？","options":["PF喊\"人工刹车\"，PM喊\"自动刹车断开\"","PM喊\"人工刹车\"，PF喊\"自动刹车断开\"","PF喊\"自动刹车断开\"，PM喊\"人工刹车\"","PM喊\"自动刹车断开\"，PF喊\"人工刹车\""],"answer":"A"},
    {"title":"进近阶段，下降率超过多少时PM应喊话“下降率”？","options":["1000英尺/分钟","1200英尺/分钟","1500英尺/分钟","2000英尺/分钟"],"answer":"B"},
    {"title":"A350机型进近阶段，坡度超过多少时PM应喊话“坡度”？","options":["5°","6°","8°","10°"],"answer":"B"},
    {"title":"进近阶段，俯仰姿态超过多少范围时PM应喊话“俯仰”？","options":["小于0°或大于8°","小于0°或大于10°","小于-2°或大于12°","小于-5°或大于15°"],"answer":"B"},

    {"title":"有顺风或侧风大于25节时的起飞操纵与推力设置是？","options":["侧杆向前压一半直到100节","与无风时完全相同一次设置FLX","侧杆保持中立，推力一次到位","侧杆向前压到底直至80节；推力渐进增加，20节地速时到CL卡位，40节地速时到FLX或TOGA卡位"],"answer":"D"},
    {"title":"仪表进近断开自动驾驶的最低高度是？","options":["不得低于最低标准高度/高","500英尺AAL","200英尺RA","100英尺RA"],"answer":"A"},
    {"title":"若使用人工推力落地，应在多少英尺之前断开自动推力？","options":["500ft AAL","1000ft AAL","1500ft AAL","2000ft AAL"],"answer":"B"},
    {"title":"巡航中检查燃油的标准时机是？","options":["当飞越一个航路点时，或每30分钟","每60分钟一次","仅在阶梯爬升前后","每15分钟一次"],"answer":"A"},
    {"title":"A350机型，空客对于VR抬轮的标准操纵技术是？","options":["使用侧杆输入获得约3度每秒的连续抬头率，抬头到初始俯仰姿态15度","使用侧杆输入获得约3度每秒的连续抬头率，抬头到初始俯仰姿态12.5度","使用侧杆输入获得约5度每秒的连续抬头率，抬头到初始俯仰姿态12.5度","使用侧杆输入获得约5度每秒的连续抬头率，抬头到初始俯仰姿态10度"],"answer":"B"},

    {"title":"滑行中获得滑行许可后，交叉检查的标准喊话是？","options":["\"左侧干净\"/\"右侧干净\"","\"左侧检查\"/\"右侧检查\"","\"左侧安全\"/\"右侧安全\"","\"左侧确认\"/\"右侧确认\""],"answer":"A"},

    {"title":"按手册“绕机检查之前”程序的规定，停机刹车手柄的设定要求和任务分工是","options":["由 PF 设定刹住，机外检查结束后再刹住以保护刹车","由 CM2 设定松开，以改善刹车冷却","由 BOTH 共同设定刹住，并在检查单中交叉确认","由 PM 设定刹住，在机外检查期间保持刹住以检查刹车磨损指示器"],"answer":"D"},
    {"title":"航班过站，一名飞行员完成外部绕机后回到驾驶舱报告绕机检查已完成，而此前驾驶舱内并未设置停留刹车。按手册规定，这一做法是否存在问题？","options":["停留刹车未设置，刹车磨损指示器无法检查，绕机检查的相应内容并未完整完成","停留刹车只影响防止飞机移动，对绕机检查的内容没有影响","只要轮挡在位，停留刹车可以不设置，报告检查完成没有问题","停留刹车应由机务设置，机组报告检查完成没有问题"],"answer":"A"},
    {"title":"航班过站，PM绕机完成后返回驾驶舱。按手册规定，两名飞行机组成员一起继续进行驾驶舱准备的条件是","options":["两名飞行机组成员就坐并且 PM 完成了 FMS检查","PF 完成顶板扫视并且已申请放行许可","旅客开始登机并且加油作业结束","PM 完成绕机检查并向机长报告"],"answer":"A"},
    {"title":"按SOPG的程序要求，机上有旅客时给飞机加油。按手册规定，建立必要通讯的要求是","options":["通讯只需在开始加油和结束加油两个时刻分别建立一次","负责在地面监控加（抽）油的机组成员、加（抽）油人员或监控人员与驾驶舱建立内话通讯，驾驶舱内负责值守的机组成员应在加（抽）油全程保持内话监听","只要客舱机组与驾驶舱保持内话畅通即可，地面人员不必接入","由机务人员与驾驶舱建立通讯，机组只需在加油结束时确认一次"],"answer":"B"},
    {"title":"按手册初步的性能确认程序的规定，初步起飞性能数据的计算与核对方式是","options":["由 CM1 和 CM2 各自计算，然后两人通过 OIS比对数据， 以保证计算结果一致","由 PF 计算，PM 在离场简令时复核数据即可","由 CM2 计算并录入 FMS，CM1 在起飞前检查单时核对","由 CM1 计算，CM2 只在数据超出经验范围时才复核"],"answer":"A"},
    {"title":"机场气象报文报告风向不定（VRB）。按手册规定，计算初始起飞性能时应当","options":["按跑道两端顺风分量的平均值计算","根据考虑恶劣情况的保守计算原则，按照拟起飞跑道的顺风予以计算","按无风条件计算","按照拟起飞跑道的逆风分量计算"],"answer":"B"},
    {"title":"当天飞机的第一次飞行，CM2把所有惯导模式选择器设定到OFF然后NAV。按手册规定，此时机组应执行的校准方式是","options":["不需要校准，由 GPS 自动更新位置","执行一次完整的校准","执行快速校准","依据其它基准的校准"],"answer":"B"},
    {"title":"驾驶舱准备期间，PF按顶板扫视顺序设置空气部分。按手册规定，交输引气选择器和空气流量选择器应分别设定在","options":["交输引气选择器自动、空气流量选择器高","交输引气选择器关断、空气流量选择器正常","交输引气选择器自动、空气流量选择器正常","交输引气选择器接通、空气流量选择器经济"],"answer":"C"},
    {"title":"在驾驶舱准备过程中，CM2检查电瓶电压时发现其中一个电瓶电压为 24 V。按手册规定，此时应当","options":["有三个符合要求即可，无特殊程序","直接接通全部电瓶继续准备，电压会在开车后自行恢复","使用外部电源或者 APU 执行电瓶的充电循环"],"answer":"C"},
    {"title":"在LTFM过站，地面有两部外部电源可用，AVAIL 灯亮。按手册规定，为了避免电气重新设置，连接外部电源的正确做法是","options":["在 EXT PWR 1 之前连接 EXT PWR 2","在 EXT PWR 2 之前连接 EXT PWR 1","两部外部电源同时连接","只连接 EXT PWR 1，EXT PWR 2 留作备用"],"answer":"A"},
    {"title":"新进副驾驶在ZUTF首次单独执行A350驾驶舱准备。按手册规定，驾驶舱准备阶段PF与PM的分工是","options":["PM 准备顶板、中央仪表板和操纵台，PF 完成FMS准备","CM1 准备顶板和中央仪表板，CM2 准备操纵台并执行外部绕机检查","两名飞行员共同准备顶板，随后由 CM2 执行外部绕机检查","PF 准备顶板、中央仪表板和操纵台，PM 执行外部绕机检查"],"answer":"D"},
    {"title":"航班的驾驶舱准备中，PF已完成FMS准备。按手册规定，PM需完成交叉检查，检查内容不包含：","options":["预计起飞航线的航路点（包括强制值）、飞行计划航路点与计算机飞行计划的对比、初始巡航高度与计算机飞行计划的对比","核对起飞跑道、V 速度和襟翼设定","核对目的地机场的剩余燃油","PF EFIS相关按键的设置"],"answer":"D"},
    {"title":"机组执行防眩板程序，两名飞行员设定并交叉检查气压基准。按手册规定，允许的最大差值分别是","options":["两个 PFD 之间 ±20 英尺，ISIS 与 PFD 之间 ±50 英尺","两个 PFD 之间 ±10 英尺，ISIS 与 PFD 之间 ±30 英尺","两个 PFD 之间 ±20 英尺，ISIS 与 PFD 之间 ±30 英尺","两个 PFD 之间 ±30 英尺，ISIS 与 PFD 之间 ±20 英尺"],"answer":"C"},
    {"title":"按手册对简令目的的规定，简令与 SOP 的关系是","options":["简令是 SOP 的组成部分，必须逐条对照检查单念读","简令与 SOP 相互独立，内容不应涉及威胁与缓解措施","简令是对 SOP 的补充，而并非是 SOP 项目的重复，应避免将简令内容与飞机系统设置和交叉检查混淆","简令是对 SOP 的复述，用于确认 SOP 项目已经全部完成"],"answer":"C"},
    {"title":"在航班运行中，机组计划在申请放行许可之前完成离场简令。按手册规定，离场简令的执行时机是","options":["离场简令可以在申请放行许可之前，但必须在驾驶舱准备流程后执行","离场简令必须在申请放行许可之后执行","离场简令必须在驾驶舱准备流程之前执行，以便建立共同意图","离场简令可以与驾驶舱准备流程同步进行，以节省过站时间"],"answer":"A"},
    {"title":"准备好推出并收到 ATC 推出指令时，PF 与地面人员之间的标准喊话顺序是：","options":["PF\"地面（来自）驾驶舱，可以推出\"→地面\"驾驶舱（来自）地面，松刹车\"→PF\"松刹车，准备推出\"","PF\"松刹车，准备推出\"→地面\"驾驶舱（来自）地面，松刹车\"→PF\"地面（来自）驾驶舱，可以推出\"","地面\"驾驶舱（来自）地面，可以推出\"→PF\"刹车已松\"→地面\"开始推出\"","PF\"地面（来自）驾驶舱，可以推出\"→PF\"松刹车，准备推出\"→地面\"收到，开始推出\""],"answer":"A"},
    {"title":"按 A350 SOP，PF 松开停机刹车手柄准备推出的前提是：","options":["地面人员已把拖销设定到牵引位置即可松开","已完成起动前检查单、通知客舱，且地面回答\"松刹车\"","已获得 ATC 推出指令即可，不必等待","两台发动机均已起动并且参数稳定"],"answer":"B"},
    {"title":"机组按下内话呼叫地面、喊出\"地面（来自）驾驶舱，可以推出\"后，未等地面人员回话即松开停机刹车。该做法的主要问题是：","options":["缺少地面人员\"松刹车\"的回答，飞机可能失去刹车约束","信标灯电门尚未接通，不满足推出前的外部灯要求","松开停机刹车应由 PM 完成，PF 不得越位操作","应当在 1 发起动完成之后才松开停机刹车"],"answer":"A"},
    {"title":"按 A350 SOP，从发动机起动选择器选到点火/起动位到接通发动机主电门，规定的等待时间是：","options":["5 秒","10 秒","20 秒","30 秒"],"answer":"B"},
    {"title":"关于 A350 发动机起动期间对发动机页面参数的处置，符合手册的表述是：","options":["必须逐项喊出 N3、滑油压力、EGT 等发动机参数","参数由 PM 逐项喊出、PF 逐项确认后接通","不是必须要喊出参数，但 PF 应监控发动机指示与系统显示页面的变化","起动期间不需要关注发动机系统显示页面的变化"],"answer":"C"},
    {"title":"按 A350 SOP，PF 向地面人员喊出\"可以取下耳机\"的时机是：","options":["两台发动机 ED 上均出现 AVAIL 时即可","起动后程序完成、检查前轮转弯断开备忘信息没有显示之后","起动后检查单完成之后","松开停机刹车、飞机开始滑行移动时"],"answer":"B"},
    {"title":"起动完成后，对最后起动的那台发动机的油门杆有何要求？","options":["保持慢车推力 30 秒","保持慢车推力 10 秒","保持慢车推力 1 分钟","不作时间要求，出现 AVAIL 即可"],"answer":"A"},
    {"title":"下降准备阶段检查状态页时，PM 应重点检查的内容是：","options":["当前的推迟的程序（所有阶段、进近和着陆）和限制，尤其是着陆能力降级","只需检查与本次进近着陆直接相关的限制条目，其余不看","只需检查着陆能力是否出现降级，推迟的程序可略过","只需核对放行文件中列明的 MEL 保留项目编号"],"answer":"A"},
    {"title":"正常检查单执行过程中被中断，继续执行时的正确做法是：","options":["由 PM 自行从中断处继续认读，不需要 PF 下口令","重新执行整份检查单，任何情况下不得从中间接续","由 PF 下口令\"继续检查单\"，PM 从中断的下一个条目开始","由 PF 下口令\"继续检查单\"，PM 从中断时的上一个条目开始"],"answer":"D"},
    {"title":"按 SOP，飞机滑出之前飞行机组必须获得的是：","options":["ATC 滑行指令许可，还要有地面人员允许滑出的手势或信号","获得 ATC 滑行指令许可即可开始滑出","获得地面维护人员的手势或信号即可滑出","ATC 滑行指令许可和主任乘务长的客舱报告即可"],"answer":"A"},
    {"title":"滑行中不能确定飞机是否处于正确的滑行路线上时，按手册应当：","options":["停止滑行，进行核实或请求地面支援","保持当前速度继续滑行，同时呼叫 ATC 确认","机组间相互证实，PF 继续滑行","PF继续滑行，等待PM与第三成员确认关键信息"],"answer":"A"},
    {"title":"进入跑道前，按手册机组应如何完成\"进近航径没有飞机活动\"这一程序？","options":["由 PF 和 PM 利用目视观察，并通过 ND检查 TCAS 显示，确认进近航径上没有飞机活动","由 PF 单独目视观察，ND 上的 TCAS 显示不作为判断依据","通过向塔台复诵进跑道指令替代，无需另行观察","由 PM 单独用 ND 上的 TCAS 显示判断即可，PF 专心操纵飞机"],"answer":"A"},
    {"title":"起飞期间塔台通报起飞跑道存在顺风分量，PF 执行起飞程序正确的是：","options":["20 节地速到 CL 卡位、40 节地速到 FLX 或 TOGA 卡位，侧杆向前压杆到底直至100节，抬轮前侧杆恢复中立。","侧杆向前压一半直至 80 节，松刹车后直接把油门杆推到 FLX 或 TOGA 卡位","20 节地速到 CL 卡位、40 节地速到 FLX 或 TOGA 卡位，侧杆向前压杆到底直至 80 节逐渐松杆，100节侧杆恢复中立。","侧杆保持中立，松刹车后一次推到 TOGA 卡位并保持"],"answer":"C"},
    {"title":"按A350 在有顺风或侧风大于 25 kt 的情况下需要使用大侧风起飞技术，油门杆到达 CL 卡位和到达 FLX 或 TOGA 卡位对应的地速分别是：","options":["30 节和 60 节","40 节和 80 节","10 节和 30 节","20 节和 40 节"],"answer":"D"},
    {"title":"飞行员金科玉律\"随时理解 FMA\"要求飞行机组始终做到的四件事是：","options":["宣布 FMA、复诵 FMA、证实 FMA、修正 FMA","监控 FMA、宣布 FMA、复诵 FMA、修正 FMA","监控 FMA、宣布 FMA、证实 FMA、理解 FMA","监控 FMA、记录 FMA、复诵 FMA、理解 FMA"],"answer":"C"},
    {"title":"A350 标准起飞程序中，PF 喊出\"起飞\"后先把所有发动机推力设定到多少，并检查发动机参数正常。","options":["慢车以上任意稳定值","1.05 EPR","25 %","50 %"],"answer":"C"},
    {"title":"起飞后加速到 F 速度，PF 下达\"襟翼 1\"口令。此后 PM 的标准喊话与动作顺序是：","options":["先回答\"明白\"，选择襟翼手柄后再回答\"速度检查\"","先选择襟翼手柄位置并回答\"襟翼 1\"，再检查速度并回答\"速度检查\"","先检查速度并回答\"速度检查\"，再选择襟翼手柄位置，检查 ECAM 襟翼指示器上的蓝色数字后回答\"襟翼 1\"","直接回答\"襟翼 1\"，襟翼手柄由 PF 自行选择"],"answer":"C"},
    {"title":"按\"进入 RVSM 区域程序\"，在进入 RVSM 空域之前必须完成的两项是：","options":["RVSM 所需设备工作、在 PFD 上检查高度指示之间的差异，均需机组 BOTH 完成","RVSM 所需设备工作由 PM 检查、高度指示差异由 PF 检查","仅需由 PM 检查 RVSM 所需设备工作","仅需由 机组在过渡高度层完成气压基准交叉检查"],"answer":"A"},
    {"title":"爬升进入 RVSM 空域之前，机组发现一项 RVSM 要求的设备失效。按手册应当：","options":["进入 RVSM 空域后立即向 ATC 报告并申请下降","必须请求新的许可，以避开 RVSM 空域","保持原许可高度层，同时加密高度交叉检查频次","由机长决定是否继续，无需通知 ATC"],"answer":"B"},
    {"title":"关于在 RVSM 空域内的自动设备使用，手册的规定是：","options":["正常情况下，不允许在 RVSM 空域实施\"AP 关，FD 关，AT 关\"的人工飞行","RVSM 空域内允许任意一种自动设备组合方式的人工飞行","RVSM 空域内只允许\"AP 关，FD 开，AT 关\"的人工飞行","RVSM 空域内机组可使用人工推力。"],"answer":"A"},
    {"title":"爬升中设置接通发动机防冰按钮电门的条件是：","options":["飞机遇到结冰条件时接通，除非大气总温（TAT）低于 -40 ℃","通过 10000 英尺 AAL 后一律接通","一到达减推力高度即接通","飞机遇到结冰条件时接通，除非大气静温（SAT）低于 -40 ℃"],"answer":"D"},
    {"title":"SOPG中对执行 EDTO 航班的要求，\"EDTO 飞行程序\"的飞行中部分，联系签派通报 EEP、ETP、EXP 时间并确认 EDTO 备降机场可用性的时机是：","options":["进入 EDTO 区域之后尽快联系","起飞后通过 10000 英尺 AAL 即联系","EEP 前 60 分钟，且飞机抵达巡航高度","EEP 之前约 20 分钟，不晚于 EEP 之前 10 分钟"],"answer":"C"},
    {"title":"大重量爬升中遇到中度颠簸，按手册对自动驾驶和自动推力使用的规定，正确做法是：","options":["断开自动推力，用人工推力稳定速度","接通自动驾驶但断开自动推力，人工控制马赫数","断开自动驾驶改人工飞行，人工修正颠簸引起的姿态变化","保持接通自驾和自动推力"],"answer":"D"},
    {"title":"巡航\"程序，检查燃油（机载燃油与 FMS 燃油预测值比较并在 OFP 上记录、检查没有燃油泄漏）的时机是：","options":["当飞越一航路点时，或每 30 分钟","每小时一次","仅在飞越 ETP 时","每 15 分钟一次"],"answer":"A"},
    {"title":"关于巡航简令、机组换座简令、更新简令等“其他运行简令”，按手册规定正确的是：","options":["它们不是强制性程序，也不要求“逐条打卡式”机械念读执行，机组应根据运行环境、工作负荷与风险点灵活取舍、突出重点、以威胁为导向完成","它们是强制性程序，必须像正常检查单一样逐条打卡式机械念读执行，不得省略","它们只在长航线和宽体机运行中执行，短航线和窄体机运行可以全部免除","它们必须由责任机长逐条念读，另一名飞行员只作应答，不参与讨论"],"answer":"A"},
    {"title":"航班下降至飞行高度 20000 英尺。按手册规定，此时应完成的动作和执行人是：","options":["PM 通知客舱机组飞机即将进入飞行关键阶段，并接通安全带灯电门","PF 通知客舱机组飞机即将进入飞行关键阶段，PM 接通安全带灯电门","PM 只接通安全带灯电门，通知客舱由乘务长自行判断","PF 接通安全带灯电门，通知客舱在着陆检查单后进行"],"answer":"A"},

    {"title":"对于强颠簸中的起飞，建议的襟翼收上时机是？","options":["按正常速度收上","增速至目标速度+20节（不超过VFE-5）后再收","离地后立即收上","保持起飞构型爬升"],"answer":"B"},

    {"title":"通过交接点时没有收到ATC指令的正确做法是？","options":["主动询问ATC","保持守听等待下一次呼叫","到强制报告点时一并报告","在121.5频率上盲发位置报告"],"answer":"A"},
    {"title":"正常情况下三部VHF电台的使用分工是？","options":["第一部主用、第二部数据通信、第三部备用","第一部作为ATC主用电台、第二部备用并守听121.5、第三部用于数据通信","三部电台由机组任意分配","第二部主用、第一部备用"],"answer":"B"},

    {"title":"怀疑收到的指令是发给相似呼号的其他航班时，正确做法是？","options":["按自己听到的内容执行","立即向管制员进行询问和证实","等待管制员主动重复","参照前机动态自行判断"],"answer":"B"},
    {"title":"200英尺AAL以下出现偏差且提醒无效时，机长或教员应？","options":["继续加强提醒直至接地","报告管制请求复飞指令","按需帮忙修正一杆","考虑立即接管操纵，实施落地或复飞"],"answer":"D"},
    {"title":"A350着陆后气象雷达的关闭方式是？","options":["由PM在着陆后流程中人工关闭","保持接通直到停机位","着陆后30秒自动关断，机组无需关注","在着陆后60秒自动关断，机组在EFIS控制面板检查WX按钮关断"],"answer":"D"}
];

// ===================== 合并全部200题，并为新增题添加（新增）标记 =====================
const allRawQuestions = [
    ...originalQuestions,
    ...extraQuestions.map(q => ({
        ...q,
        title: q.title + '（新增）'
    }))
];

// 最终题库即为 allRawQuestions（共200题）
// ===================== 核心逻辑 =====================
let currentMode = 'order';
let allQuestions = [];
let cur = 0;
let completedQuestions = new Set();
let errorQuestions = [];
let errorQuestionIds = [];

function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function getStoragePrefix() { return 'sop_integrated_200_' + currentMode + '_'; }

function loadData() {
    const prefix = getStoragePrefix();
    const savedCur = localStorage.getItem(prefix + 'cur');
    if (savedCur !== null) cur = parseInt(savedCur);
    const savedCompleted = localStorage.getItem(prefix + 'completed');
    if (savedCompleted) completedQuestions = new Set(JSON.parse(savedCompleted));
    const savedErrors = localStorage.getItem('sop_integrated_200_error_questions');
    if (savedErrors) {
        errorQuestions = JSON.parse(savedErrors);
        errorQuestionIds = errorQuestions.map(q => q.id);
    }
    updateProgressInfo();
    document.getElementById('totalCount').innerText = allQuestions.length;
}

function saveProgress() {
    const prefix = getStoragePrefix();
    localStorage.setItem(prefix + 'cur', cur);
    localStorage.setItem(prefix + 'completed', JSON.stringify([...completedQuestions]));
    localStorage.setItem('sop_integrated_200_error_questions', JSON.stringify(errorQuestions));
}

function updateProgressInfo() {
    document.getElementById('completedCount').innerText = completedQuestions.size;
    document.getElementById('errorCount').innerText = errorQuestions.length;
}

function addToErrorBook(question) {
    if (!errorQuestionIds.includes(question.id)) {
        errorQuestions.push(question);
        errorQuestionIds.push(question.id);
        saveProgress();
        updateProgressInfo();
    }
}
function removeFromErrorBook(questionId) {
    errorQuestions = errorQuestions.filter(q => q.id !== questionId);
    errorQuestionIds = errorQuestions.map(q => q.id);
    saveProgress();
    updateProgressInfo();
}

function setMode(mode) {
    if (mode === currentMode) return;
    currentMode = mode;
    document.querySelectorAll('.func-btn[data-mode]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
    });
    buildQuestionList();
    cur = 0;
    loadData();
    render();
}

function buildQuestionList() {
    let list = [];
    if (currentMode === 'order') {
        list = allRawQuestions.map((q, idx) => ({...q, id: idx + 1}));
    } else if (currentMode === 'random') {
        list = allRawQuestions.map((q, idx) => ({...q, id: idx + 1}));
        shuffleArray(list);
        list.forEach((q, i) => q.id = i + 1);
    } else if (currentMode === 'error') {
        list = errorQuestions.map((q, idx) => ({...q, id: idx + 1}));
    }
    allQuestions = list;
    if (currentMode === 'error' && allQuestions.length === 0) {
        alert('当前没有错题，请先在其他模式下练习积累错题。');
        currentMode = 'order';
        document.querySelectorAll('.func-btn[data-mode]').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.mode === 'order');
        });
        buildQuestionList();
    }
    document.getElementById('total').innerText = allQuestions.length;
    document.getElementById('totalCount').innerText = allQuestions.length;
}

function render() {
    if (allQuestions.length === 0) {
        document.getElementById('qTitle').innerText = '暂无题目';
        document.getElementById('opts').innerHTML = '';
        document.getElementById('feedback').className = 'feedback';
        document.getElementById('feedback').innerHTML = '';
        updateNavButtons();
        return;
    }
    if (cur >= allQuestions.length) cur = allQuestions.length - 1;
    if (cur < 0) cur = 0;
    const q = allQuestions[cur];
    document.getElementById('current').innerText = cur + 1;
    document.getElementById('total').innerText = allQuestions.length;
    document.getElementById('qTitle').innerText = q.title;
    document.getElementById('type').innerText = '单选题';

    const optsDiv = document.getElementById('opts');
    optsDiv.innerHTML = '';
    const feedback = document.getElementById('feedback');
    feedback.className = 'feedback';
    feedback.innerHTML = '';

    const isCompleted = completedQuestions.has(q.id);

    q.options.forEach((t, i) => {
        const optDiv = document.createElement('div');
        optDiv.className = 'opt';
        const letter = String.fromCharCode(65 + i);
        optDiv.innerText = `${letter}: ${t}`;
        if (errorQuestionIds.includes(q.id)) {
            const mark = document.createElement('span');
            mark.className = 'mark-wrong';
            mark.innerText = '错题';
            optDiv.appendChild(mark);
        }
        if (isCompleted) {
            const isCorrect = (letter === q.answer);
            optDiv.classList.add(isCorrect ? 'correct' : 'wrong');
            optDiv.classList.add('disabled');
        } else {
            optDiv.onclick = () => {
                document.querySelectorAll('.opt').forEach(x => x.classList.remove('correct', 'wrong', 'disabled'));
                const isCorrect = (letter === q.answer);
                optDiv.classList.add(isCorrect ? 'correct' : 'wrong');
                document.querySelectorAll('.opt').forEach(x => x.classList.add('disabled'));
                feedback.className = 'feedback show';
                if (isCorrect) {
                    feedback.classList.add('correct');
                    feedback.innerHTML = '✅ 回答正确！';
                    removeFromErrorBook(q.id);
                    completedQuestions.add(q.id);
                    saveProgress();
                    updateProgressInfo();
                } else {
                    feedback.classList.add('wrong');
                    const correctLetter = q.answer;
                    const correctIndex = ['A','B','C','D'].indexOf(correctLetter);
                    const correctText = q.options[correctIndex] || '';
                    feedback.innerHTML = `❌ 回答错误。正确答案是：<strong>${correctLetter}. ${correctText}</strong>`;
                    addToErrorBook(q);
                }
                // 重新渲染以同步状态（保留反馈）
                const fbHTML = feedback.innerHTML;
                const fbClass = feedback.className;
                render();
                const newFeedback = document.getElementById('feedback');
                newFeedback.className = fbClass;
                newFeedback.innerHTML = fbHTML;
            };
        }
        optsDiv.appendChild(optDiv);
    });

    if (isCompleted) {
        feedback.className = 'feedback show correct';
        feedback.innerHTML = '✅ 本题已答对！';
    }

    updateNavButtons();
}

function updateNavButtons() {
    document.getElementById('prev').disabled = (cur === 0);
    document.getElementById('next').disabled = (cur === allQuestions.length - 1);
}

function goPrev() {
    if (cur > 0) { cur--; render(); saveProgress(); }
}
function goNext() {
    if (cur < allQuestions.length - 1) { cur++; render(); saveProgress(); }
}

function doSearch() {
    const kw = document.getElementById('searchInput').value.toLowerCase();
    if (!kw) return;
    for (let i = 0; i < allQuestions.length; i++) {
        if (allQuestions[i].title.toLowerCase().includes(kw)) {
            cur = i;
            render();
            saveProgress();
            return;
        }
    }
    alert('未找到匹配题目');
}
function clearSearch() { document.getElementById('searchInput').value = ''; }

function openErrorBook() {
    const modal = document.getElementById('errorModal');
    const errorList = document.getElementById('errorList');
    const emptyTip = document.getElementById('emptyErrorTip');
    errorList.innerHTML = '';
    if (errorQuestions.length === 0) {
        emptyTip.style.display = 'block';
    } else {
        emptyTip.style.display = 'none';
        errorQuestions.forEach((q, index) => {
            const errorItem = document.createElement('div');
            errorItem.className = 'error-item';
            let answerText = '';
            const idx = ['A','B','C','D'].indexOf(q.answer);
            answerText = `正确答案：${q.answer} - ${q.options[idx] || ''}`;
            errorItem.innerHTML = `
                <div class="error-item-title">
                    第${q.id}题：${q.title}
                    <span class="show-answer" onclick="showErrorAnswer(${index})">查看答案</span>
                    <span class="show-answer" style="color:#ef4444" onclick="removeErrorQuestion(${q.id})">移除</span>
                    <span class="show-answer" style="color:#10b981" onclick="gotoErrorQuestion(${q.id})">前往做题</span>
                </div>
                <div class="error-item-options">
                    ${q.options.map((opt, i) => `<div>${String.fromCharCode(65+i)}: ${opt}</div>`).join('')}
                </div>
                <div class="error-item-answer" id="errorAnswer_${index}" style="display:none">${answerText}</div>
            `;
            errorList.appendChild(errorItem);
        });
    }
    modal.style.display = 'flex';
}
function closeErrorBook() { document.getElementById('errorModal').style.display = 'none'; }
function showErrorAnswer(index) {
    const el = document.getElementById(`errorAnswer_${index}`);
    if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}
function removeErrorQuestion(questionId) {
    if (confirm('确定要移除这道错题吗？')) {
        removeFromErrorBook(questionId);
        if (currentMode === 'error') {
            buildQuestionList();
            if (allQuestions.length === 0) setMode('order');
            else render();
        } else {
            openErrorBook();
            render();
        }
    }
}
function gotoErrorQuestion(questionId) {
    closeErrorBook();
    if (currentMode !== 'order' && currentMode !== 'random') setMode('order');
    const idx = allQuestions.findIndex(q => q.id === questionId);
    if (idx !== -1) { cur = idx; render(); saveProgress(); }
    else alert('该错题不在当前模式列表中，请切换到顺序或随机模式查找。');
}

function resetProgress() {
    if (confirm('确定要重置所有进度和错题本吗？此操作不可恢复！')) {
        const prefix = getStoragePrefix();
        localStorage.removeItem(prefix + 'cur');
        localStorage.removeItem(prefix + 'completed');
        localStorage.removeItem('sop_integrated_200_error_questions');
        cur = 0;
        completedQuestions.clear();
        errorQuestions = [];
        errorQuestionIds = [];
        buildQuestionList();
        render();
        saveProgress();
        updateProgressInfo();
    }
}

document.getElementById('prev').onclick = goPrev;
document.getElementById('next').onclick = goNext;

window.onload = function() {
    currentMode = 'order';
    document.querySelectorAll('.func-btn[data-mode]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === 'order');
    });
    buildQuestionList();
    loadData();
    render();
};
</script>
